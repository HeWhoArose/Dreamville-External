name: Dreamville Release Gate

on:
  push:
    branches:
      - main
      - 'phases*'
  pull_request:
    branches:
      - main
      - 'phases*'

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify release contracts
        run: npm run verify:contracts

      - name: Type-check
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
