name: temporary-character-genesis-parse

on:
  push:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Parse CharacterGenesisView
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';

          const file = 'src/components/characterGenesis/CharacterGenesisView.tsx';
          const source = fs.readFileSync(file, 'utf8');
          const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);

          const format = (diagnostic) => {
            const start = diagnostic.start ?? 0;
            const lc = sf.getLineAndCharacterOfPosition(start);
            return {
              code: diagnostic.code,
              category: diagnostic.category,
              line: lc.line + 1,
              column: lc.character + 1,
              start,
              length: diagnostic.length ?? 0,
              message: ts.flattenDiagnosticMessageText(diagnostic.messageText, '\\n'),
              snippet: source.split('\\n').slice(Math.max(0, lc.line - 3), lc.line + 4).join('\\n'),
            };
          };

          const scanner = ts.createScanner(ts.ScriptTarget.Latest, true, ts.LanguageVariant.JSX, source);
          const tokens = [];
          let token = scanner.scan();
          while (token !== ts.SyntaxKind.EndOfFileToken) {
            const startPos = scanner.getTokenPos();
            const endPos = scanner.getTextPos();
            if (Math.abs(startPos - 158953) < 1400) {
              tokens.push({
                start: startPos,
                end: endPos,
                kind: ts.tokenToString(token) || token,
                text: source.slice(startPos, endPos),
              });
            }
            token = scanner.scan();
          }
          const targetPositions = [158953, 219567];
          const tokenContexts = targetPositions.map((position) => {
            const token = ts.getTokenAtPosition(sf, position);
            const parents = [];
            let node = token;
            for (let depth = 0; node && depth < 12; depth += 1, node = node.parent) {
              parents.push({
                kind: ts.SyntaxKind[node.kind],
                pos: node.pos,
                end: node.end,
                text: source.slice(node.pos, Math.min(node.end, node.pos + 240)),
              });
            }
            return {
              position,
              tokenKind: token ? ts.SyntaxKind[token.kind] : null,
              tokenText: token ? token.getText(sf) : null,
              parents,
            };
          });
          const diagnostics = sf.parseDiagnostics.map(format);
          const interestingLines = source.split('\\n');
          const windows = diagnostics.map((d) => ({
            sourceWindow: source.slice(Math.max(0, d.start - 1200), Math.min(source.length, d.start + 1600)),
          }));
          console.log(JSON.stringify({
            parseDiagnostics: diagnostics,
            windows,
            syntaxDiagnostics: sf.getChildren(sf).length,
            tokenContexts,
            tokens,
          }, null, 2));

          if (sf.parseDiagnostics.length) process.exit(1);
          NODE
