name: temporary-character-genesis-bisect

on:
  push:

jobs:
  parse:
    strategy:
      fail-fast: false
      matrix:
        target_sha:
          - 8dc3ac8b0f7f0a84e9310e4aba13f896b8f9dfdd
          - f81086d98be76d7bd04cf8989d717386e2acbe17
          - 6069cefc9e854aa1e661c982f32a7c1461e07ca1
          - 11b9852ef8a7cc60b45d188521db660d10492a01
          - df428639a25d7bf7b809d0ff86a50ffa0ee55057
          - bcd2c7ec24e34dc00acc9f27ea3f7551d2f04cf5
          - 30affa445934f3794b42b8f84ebde9291537db4a
          - 7a0e0026d3131ca3a8241384fd4edc5020bdffb2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Parse CharacterGenesisView
        env:
          TARGET_SHA: ${{ matrix.target_sha }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';

          const file = 'src/components/characterGenesis/CharacterGenesisView.tsx';
          const source = fs.readFileSync(file, 'utf8');
          const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
          const diagnostics = sf.parseDiagnostics.map((d) => {
            const start = d.start ?? 0;
            const lc = sf.getLineAndCharacterOfPosition(start);
            return {
              code: d.code,
              line: lc.line + 1,
              column: lc.character + 1,
              message: ts.flattenDiagnosticMessageText(d.messageText, '\\n'),
            };
          });

          console.log(JSON.stringify({
            targetSha: process.env.TARGET_SHA,
            lineCount: source.split('\\n').length,
            diagnostics,
          }, null, 2));

          if (diagnostics.length) process.exit(1);
          NODE
